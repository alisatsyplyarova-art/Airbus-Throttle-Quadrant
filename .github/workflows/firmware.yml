name: Firmware checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test axis math on host
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/axis_math_test.cpp -o axis_math_test
          ./axis_math_test
      - name: Test configuration validation and CRC
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/config_core_test.cpp -o config_core_test
          ./config_core_test

  arduino-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/checkout@v4
      - name: Install SparkFun AVR core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/sparkfun/Arduino_Boards/main/IDE_Board_Manager/package_sparkfun_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr SparkFun:avr
      - name: Install Joystick library 2.1.1
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 --branch v2.1.1 https://github.com/MHeironimus/ArduinoJoystickLibrary.git "$HOME/Arduino/libraries/Joystick"
      - name: Compile Pro Micro 5V/16MHz
        run: arduino-cli compile --fqbn SparkFun:avr:promicro:cpu=16MHzatmega32U4 Firmware/AirbusThrottleQuadrant
